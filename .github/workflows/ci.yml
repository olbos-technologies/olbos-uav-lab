name: standalone-validation
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtest-dev
      - run: cmake -S . -B build -DUAV_BUILD_GTEST=ON && cmake --build build && ctest --test-dir build --output-on-failure --output-junit ctest-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpp-test-results
          path: build/ctest-results.xml
      - run: python3 -m pip install websockets==15.0.1 clang-format==19.1.7
      - run: clang-format --dry-run --Werror core/include/uav/*.hpp core/*.cpp tests/unit/*.cpp ros2_ws/src/uav_controller/src/sitl_mission.cpp
      - run: bash scripts/run_demo.sh && python3 -m unittest discover -s tests/integration -v
      - name: Fault-injection safety report
        run: |
          bash scripts/run_scenarios.sh
          cat artifacts/scenarios/safety-report.md >> "$GITHUB_STEP_SUMMARY"
          for c in config/*.yaml; do
            bash scripts/run_scenarios.sh --config "$c" --out "artifacts/scenarios/$(basename "$c" .yaml)"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-report
          path: artifacts/scenarios
  dashboard:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: cd dashboard && npm ci && npm run build
