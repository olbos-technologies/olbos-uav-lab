sitl_mission:
  ros__parameters:
    max_altitude: 15.0
    geofence_radius: 40.0
    max_speed: 2.0
    stale_seconds: 2.0
    min_battery: 0.2
    # Seconds from node start; routes that cannot finish within these are rejected at startup.
    mission_deadline: 90.0
    leg_timeout: 30.0
    takeoff_height: 5.0
    # Optional ENU navigation triples after vertical takeoff. Empty = smoke ascent/land.
    waypoints_enu: []
